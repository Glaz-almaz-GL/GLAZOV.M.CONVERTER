<?xml version="1.0" encoding="UTF-8"?>
<!-- Документ A4 в миллиметрах: заголовок с градиентом, абзацы через tspan, таблица, полупрозрачные слои, повёрнутая надпись. -->
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3d91"/>
      <stop offset="1" stop-color="#3fa9f5"/>
    </linearGradient>
    <radialGradient id="badge" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffcc00" stop-opacity="0.9"/>
    </radialGradient>
  </defs>
  <rect width="210" height="297" fill="#fdfdf8"/>
  <rect x="0" y="0" width="210" height="40" fill="url(#header)"/>
  <text x="15" y="25" font-family="Georgia, serif" font-size="12" fill="#ffffff" font-weight="bold">Отчёт о конвертации</text>
  <circle cx="185" cy="20" r="13" fill="url(#badge)" stroke="#b38f00" stroke-width="0.8"/>
  <text x="185" y="23.5" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#5c4a00">v1</text>
  <text font-family="sans-serif" font-size="5" fill="#222222">
    <tspan x="15" y="60">Библиотека превращает файлы между форматами одним вызовом:</tspan>
    <tspan x="15" dy="7">для файла, папки и потока, с отчётом и отменой.</tspan>
    <tspan x="15" dy="7" font-style="italic" fill="#0b3d91">Тип входа подтверждается по начальным байтам.</tspan>
  </text>
  <g transform="translate(15,95)" font-family="sans-serif" font-size="4.5">
    <rect width="180" height="10" fill="#0b3d91" opacity="0.85"/>
    <text x="3" y="7" fill="#ffffff">Вход</text>
    <text x="63" y="7" fill="#ffffff">Результат</text>
    <text x="123" y="7" fill="#ffffff">Время</text>
    <rect y="10" width="180" height="10" fill="#e8eef9"/>
    <text x="3" y="17" fill="#222222">логотип.svg</text>
    <text x="63" y="17" fill="#222222">PNG</text>
    <text x="123" y="17" fill="#222222">0,02 с</text>
    <rect y="20" width="180" height="10" fill="#ffffff"/>
    <text x="3" y="27" fill="#222222">схема.svg</text>
    <text x="63" y="27" fill="#222222">WebP</text>
    <text x="123" y="27" fill="#222222">0,03 с</text>
    <line x1="60" y1="0" x2="60" y2="30" stroke="#9db3d9" stroke-width="0.3"/>
    <line x1="120" y1="0" x2="120" y2="30" stroke="#9db3d9" stroke-width="0.3"/>
  </g>
  <g opacity="0.5">
    <rect x="30" y="160" width="80" height="60" fill="#e63946"/>
    <rect x="70" y="190" width="80" height="60" fill="#457b9d"/>
  </g>
  <text x="170" y="250" font-family="sans-serif" font-size="8" fill="#e63946" transform="rotate(-30 170 250)" text-anchor="middle">ОБРАЗЕЦ</text>
  <line x1="15" y1="280" x2="195" y2="280" stroke="#999999" stroke-width="0.4" stroke-dasharray="2 1"/>
  <text x="105" y="288" font-family="sans-serif" font-size="4" fill="#777777" text-anchor="middle">страница 1 из 1</text>
</svg>
